name: Build Blog Backend

on: 
  push:
    branches:
      - main
      - portfolio
  pull_request:
    branches:
      [main, portfolio]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
     
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Login to DockerHub
        run: docker login -u ${{vars.DOCKER_USERNAME}} -p ${{secrets.DOCKER_TOKEN}}

      - name: Build docker image
        run: |
          docker build -t blog_backend .

      - name: Tag image
        run: docker tag blog_backend:latest ${{vars.DOCKER_USERNAME}}/blog_backend:${{github.sha}}

      - name: Push image
        run: docker push ${{vars.DOCKER_USERNAME}}/blog_backend:${{github.sha}}

  EC2-Deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build & Deploy
        env:
            PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            HOSTNAME: ${{secrets.SSH_HOST}}
            USER_NAME: ${{secrets.USER_NAME}}
        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} '
          docker run  -d -p 8000:8000 --name blog_backend ${{vars.DOCKER_USERNAME}}/blog_backend:${{github.sha}}